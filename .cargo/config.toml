[build]
#rustflags = ["-C", "target-cpu=native"]

[profile.release]
lto = false
codegen-units = 16
panic = "abort"

[profile.test]
incremental = false

# Linux (Ubuntu) lld linker configuration
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# Windows (MSVC toolchain) lld linker configuration
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]