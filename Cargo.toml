[package]
name = "md"
version = "0.1.0"
edition = "2021"
resolver = "2"

[dependencies]
# Move your workspace dependencies here
rand = "0.8"
rand_distr = "0.4"
three-d = "0.19"
glam = { version = "0.27", features = ["serde"] }
image = "0.24"
winit = "0.28"
serde = "1.0.228"
serde_json = "1.0.138" # Update this to match as well
polars = { version = "0.38", features = ["parquet"] }
tempfile = "3.24.0"
itertools = "0.13"
soa_derive = "0.13"
chrono = "0.4"
bytemuck = "1.14"
glob = "0.3"
rayon = "1.10"


[profile.release]
opt-level = 3          # Maximum optimization level (default for release)
lto = "fat"            # Fat Link-Time Optimization allows the compiler to optimize across crate boundaries
codegen-units = 1      # Reduces parallel code generation to let the compiler perform better whole-program optimizations (slower compile times, faster binary)
panic = "abort"        # Removes unwrap/panic unwinding overhead
target-cpu = "native"  # Optimizes instructions specifically for your CPU architecture (AVX2, AVX-512, etc.)

[lib]
doctest = false
